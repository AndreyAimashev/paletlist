name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/paletlist
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            echo "Deployed: $(git log -1 --oneline)"
            grep -q 'method: "POST"' admin.html || { echo "admin.html: нет POST для Unirus — проверьте pull"; exit 1; }
            grep -q "buildUnirusSheetPayload" admin.html || { echo "admin.html: нет buildUnirusSheetPayload"; exit 1; }
            grep -q "_compute_unirus_text_replacements" api_server.py || { echo "api_server.py: старая версия Unirus"; exit 1; }
            if [ -f requirements.txt ]; then
              if ! python3 -m pip --version 2>/dev/null; then
                sudo apt-get update -qq
                sudo apt-get install -y python3-pip
              fi
              python3 -m pip install --break-system-packages -r requirements.txt
            fi
            if [ -f package.json ]; then
              npm ci --omit=dev
            fi
            sudo systemctl reload nginx || true
            # Обязательно перезапустить процесс Python, иначе останется старый api_server.py
            sudo systemctl restart paletlist-api.service || sudo systemctl try-restart paletlist-api.service || true
