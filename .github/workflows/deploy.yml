name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via HTTPS webhook
        id: deploy
        continue-on-error: true
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_HOST:-}" ] || [ -z "${DEPLOY_SECRET:-}" ]; then
            echo "Need secrets SERVER_HOST and DEPLOY_SECRET"
            exit 1
          fi
          # Self-signed cert is expected until Let's Encrypt / DNS is ready.
          code=$(curl -kfsS -o /tmp/deploy-resp.json -w "%{http_code}" \
            -X POST "https://${SERVER_HOST}/api/deploy" \
            -H "Authorization: Bearer ${DEPLOY_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --max-time 60 || true)
          echo "HTTP $code"
          cat /tmp/deploy-resp.json || true
          echo
          test "$code" = "202" -o "$code" = "200"

      - name: Deploy via HTTPS webhook (retry 1)
        id: deploy_retry1
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          set -euo pipefail
          sleep 5
          code=$(curl -kfsS -o /tmp/deploy-resp.json -w "%{http_code}" \
            -X POST "https://${SERVER_HOST}/api/deploy" \
            -H "Authorization: Bearer ${DEPLOY_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --max-time 60 || true)
          echo "HTTP $code"
          cat /tmp/deploy-resp.json || true
          echo
          test "$code" = "202" -o "$code" = "200"

      - name: Deploy via HTTPS webhook (retry 2)
        id: deploy_retry2
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry1.outcome == 'failure'
        continue-on-error: true
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          set -euo pipefail
          sleep 10
          code=$(curl -kfsS -o /tmp/deploy-resp.json -w "%{http_code}" \
            -X POST "https://${SERVER_HOST}/api/deploy" \
            -H "Authorization: Bearer ${DEPLOY_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            --max-time 90 || true)
          echo "HTTP $code"
          cat /tmp/deploy-resp.json || true
          echo
          test "$code" = "202" -o "$code" = "200"

      - name: Wait for deploy to finish
        if: >
          steps.deploy.outcome == 'success' ||
          steps.deploy_retry1.outcome == 'success' ||
          steps.deploy_retry2.outcome == 'success'
        run: sleep 25

      - name: Fail if all deploy attempts failed
        if: >
          always() &&
          steps.deploy.outcome != 'success' &&
          steps.deploy_retry1.outcome != 'success' &&
          steps.deploy_retry2.outcome != 'success'
        run: |
          echo "HTTPS deploy webhook failed after retries."
          echo "Check secrets SERVER_HOST + DEPLOY_SECRET, HTTPS on the server,"
          echo "and /var/log/paletlist-deploy.log"
          exit 1
