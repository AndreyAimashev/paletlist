<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paletlist - Админ</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap"
    />
    <style>
      :root {
        --bg-primary: #0a0e17;
        --bg-secondary: #121826;
        --accent-teal: #00c8a0;
        --accent-purple: #b967ff;
        --text-main: #e0e0ff;
        --text-muted: #a0a0c0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
        color: var(--text-main);
        font-family: "Roboto", sans-serif;
      }

      .panel {
        width: min(560px, 90vw);
        border: 1px solid rgba(0, 200, 160, 0.25);
        border-radius: 16px;
        background: rgba(18, 24, 38, 0.82);
        backdrop-filter: blur(8px);
        padding: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        transform-origin: top center;
        animation: unfoldMenu 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      h1 {
        margin: 0 0 10px;
        font-family: "Orbitron", sans-serif;
        background: linear-gradient(to right, var(--accent-teal), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .muted {
        color: var(--text-muted);
      }

      .menu-button {
        display: inline-block;
        margin-top: 18px;
        border: none;
        border-radius: 30px;
        padding: 12px 18px;
        font-family: "Orbitron", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        text-decoration: none;
        color: #09111e;
        background: linear-gradient(45deg, var(--accent-teal), var(--accent-purple));
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .menu-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 200, 160, 0.35);
      }

      .menu-items {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .menu-step {
        display: none;
      }

      .menu-step.visible {
        display: inline-block;
      }

      .back-button {
        display: none;
      }

      .back-button.visible {
        display: inline-block;
      }

      @keyframes unfoldMenu {
        0% {
          opacity: 0;
          transform: perspective(700px) rotateX(-25deg) scaleY(0.65);
        }
        100% {
          opacity: 1;
          transform: perspective(700px) rotateX(0deg) scaleY(1);
        }
      }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>Главное меню</h1>
      <p class="muted">Вы вошли как администратор.</p>
      <div class="menu-items">
        <button id="pallet-list-button" class="menu-button" type="button">Паллетные листы</button>
        <button id="back-button" class="menu-button menu-step back-button" type="button">Назад</button>
        <button id="create-pallet-button" class="menu-button menu-step" type="button">
          Создать паллетный лист
        </button>
        <button id="arnest-button" class="menu-button menu-step" type="button">Арнест Юнирусь</button>
      </div>
    </section>

    <script>
      const params = new URLSearchParams(window.location.search);
      const login = params.get("login");
      const password = params.get("password");

      if (!(login === "admin" && password === "1241")) {
        window.location.replace("index.html");
      }

      const palletListButton = document.getElementById("pallet-list-button");
      const backButton = document.getElementById("back-button");
      const createPalletButton = document.getElementById("create-pallet-button");
      const arnestButton = document.getElementById("arnest-button");

      palletListButton.addEventListener("click", () => {
        palletListButton.style.display = "none";
        backButton.classList.add("visible");
        createPalletButton.classList.add("visible");
        arnestButton.classList.remove("visible");
      });

      createPalletButton.addEventListener("click", () => {
        arnestButton.classList.add("visible");
      });

      backButton.addEventListener("click", () => {
        backButton.classList.remove("visible");
        createPalletButton.classList.remove("visible");
        arnestButton.classList.remove("visible");
        palletListButton.style.display = "inline-block";
      });
    </script>
  </body>
</html>
