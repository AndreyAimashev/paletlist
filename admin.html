<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paletlist - Админ</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <style>
      :root {
        --bg-primary: #0a0e17;
        --bg-secondary: #121826;
        --accent-teal: #00c8a0;
        --accent-purple: #b967ff;
        --text-main: #e0e0ff;
        --text-muted: #a0a0c0;
        --sidebar-width: 360px;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
        color: var(--text-main);
        font-family: "Roboto", sans-serif;
      }

      body.resizing {
        cursor: col-resize;
        user-select: none;
      }

      .app {
        min-height: 100vh;
        display: flex;
      }

      .main-area {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(560px, 90vw);
        border: 1px solid rgba(0, 200, 160, 0.25);
        border-radius: 16px;
        background: rgba(18, 24, 38, 0.82);
        backdrop-filter: blur(8px);
        padding: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        transform-origin: top center;
        animation: unfoldMenu 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .panel.wide {
        width: min(980px, 94vw);
      }

      .panel.transitioning {
        animation: panelPulse 320ms ease;
      }

      .panel.fx-main {
        animation: fxMain 340ms ease;
      }

      .panel.fx-pallet {
        animation: fxPallet 340ms ease;
      }

      .panel.fx-create {
        animation: fxCreate 340ms ease;
      }

      .panel.fx-arnest {
        animation: fxArnest 360ms ease;
      }

      .panel.fx-orders {
        animation: fxOrders 340ms ease;
      }

      .panel.fx-assemble {
        animation: fxAssemble 340ms ease;
      }

      .panel.fx-nomenclature {
        animation: fxNomenclature 360ms ease;
      }

      h1 {
        margin: 0 0 10px;
        font-family: "Orbitron", sans-serif;
        background: linear-gradient(to right, var(--accent-teal), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .title-swap {
        animation: titleGlitch 300ms ease;
      }

      .muted {
        color: var(--text-muted);
      }

      .menu-button {
        display: inline-block;
        margin-top: 18px;
        border: none;
        border-radius: 30px;
        padding: 12px 18px;
        font-family: "Orbitron", sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        text-decoration: none;
        color: #09111e;
        background: linear-gradient(45deg, var(--accent-teal), var(--accent-purple));
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .menu-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 200, 160, 0.35);
      }

      .menu-items {
        margin-top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .menu-step {
        display: none;
      }

      .menu-step.visible {
        display: inline-block;
        animation: techSlideIn 220ms ease;
      }

      .back-button {
        display: none;
      }

      .back-button.visible {
        display: inline-block;
      }

      .arnest-workspace {
        display: none;
        margin-top: 22px;
        border: 1px solid rgba(0, 200, 160, 0.2);
        border-radius: 12px;
        padding: 16px;
        background: rgba(10, 14, 23, 0.55);
      }

      .arnest-workspace.visible {
        display: block;
        animation: workspaceReveal 260ms ease;
      }

      .arnest-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .arnest-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .arnest-field label {
        color: var(--text-muted);
        font-size: 13px;
      }

      .arnest-field input {
        border: 1px solid rgba(0, 200, 160, 0.25);
        border-radius: 8px;
        padding: 10px;
        background: rgba(10, 14, 23, 0.85);
        color: var(--text-main);
      }

      .arnest-actions {
        margin-top: 12px;
      }

      .arnest-output {
        margin-top: 14px;
        border: 1px solid rgba(0, 200, 160, 0.2);
        border-radius: 10px;
        padding: 12px;
        background: rgba(18, 24, 38, 0.75);
        line-height: 1.45;
      }

      .nomenclature-workspace {
        display: none;
        margin-top: 22px;
        border: 1px solid rgba(0, 200, 160, 0.2);
        border-radius: 12px;
        padding: 16px;
        background: rgba(10, 14, 23, 0.55);
        max-height: 68vh;
        overflow: auto;
      }

      .nomenclature-workspace.visible {
        display: block;
        animation: workspaceReveal 260ms ease;
      }

      .nomenclature-item {
        padding: 10px;
        border-bottom: 1px solid rgba(0, 200, 160, 0.15);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .nomenclature-item:last-child {
        border-bottom: none;
      }

      .nomenclature-item .article {
        color: var(--accent-teal);
        font-weight: 700;
      }

      .nomenclature-meta {
        min-width: 0;
        flex: 1;
      }

      .nomenclature-pack-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 14px;
        margin-top: 6px;
        font-size: 0.88rem;
        color: rgba(220, 230, 245, 0.88);
      }

      .nomenclature-pack-line .pack-stat {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }

      .pack-icon {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
        color: var(--accent-teal);
        opacity: 0.92;
      }

      .nomenclature-actions {
        display: flex;
        gap: 6px;
      }

      .icon-btn {
        width: 28px;
        height: 28px;
        border: 1px solid rgba(0, 200, 160, 0.35);
        border-radius: 8px;
        background: rgba(18, 24, 38, 0.85);
        color: var(--text-main);
        cursor: pointer;
      }

      .icon-btn:hover {
        border-color: var(--accent-teal);
      }

      .nomenclature-search {
        width: 100%;
        margin: 8px 0 14px;
        border: 1px solid rgba(0, 200, 160, 0.25);
        border-radius: 8px;
        padding: 10px 12px;
        background: rgba(10, 14, 23, 0.85);
        color: var(--text-main);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(6, 10, 18, 0.72);
        backdrop-filter: blur(4px);
      }

      .modal-overlay[hidden] {
        display: none !important;
      }

      .modal-dialog {
        width: min(520px, 100%);
        max-height: 90vh;
        overflow: auto;
        border: 1px solid rgba(0, 200, 160, 0.3);
        border-radius: 14px;
        background: rgba(18, 24, 38, 0.96);
        padding: 22px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      .modal-dialog h3 {
        margin: 0 0 16px;
        font-family: "Orbitron", sans-serif;
        font-size: 15px;
        color: var(--accent-teal);
      }

      .arnest-field textarea {
        border: 1px solid rgba(0, 200, 160, 0.25);
        border-radius: 8px;
        padding: 10px;
        background: rgba(10, 14, 23, 0.85);
        color: var(--text-main);
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        min-height: 52px;
      }

      .modal-actions {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      .modal-actions .menu-button {
        margin-top: 0;
      }

      .sidebar {
        position: relative;
        width: var(--sidebar-width);
        min-width: 260px;
        max-width: 620px;
        border-left: 1px solid rgba(0, 200, 160, 0.2);
        background: rgba(12, 16, 28, 0.96);
        display: flex;
        flex-direction: column;
        padding: 24px 20px;
      }

      .sidebar.collapsed {
        width: 0 !important;
        min-width: 0;
        max-width: 0;
        padding: 0;
        border-left: none;
        overflow: visible;
      }

      .sidebar.collapsed > :not(.sidebar-toggle) {
        display: none;
      }

      .sidebar-toggle {
        position: absolute;
        left: -26px;
        top: 14px;
        width: 22px;
        height: 22px;
        border: 1px solid rgba(0, 200, 160, 0.45);
        border-radius: 6px;
        background: rgba(12, 16, 28, 0.95);
        color: var(--text-main);
        cursor: pointer;
        font-size: 12px;
        line-height: 1;
        display: grid;
        place-items: center;
      }

      .sidebar.collapsed .sidebar-toggle {
        left: -26px;
      }

      .resize-handle {
        position: absolute;
        left: -4px;
        top: 0;
        width: 8px;
        height: 100%;
        cursor: col-resize;
      }

      .resize-handle::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 0;
        width: 2px;
        height: 100%;
        background: rgba(0, 200, 160, 0.25);
      }

      .sidebar-title {
        margin: 0 0 8px;
        font-family: "Orbitron", sans-serif;
        font-size: 18px;
      }

      .sidebar-note {
        margin: 0 0 16px;
        color: var(--text-muted);
      }

      .quick-nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .quick-nav button {
        border: 1px solid rgba(0, 200, 160, 0.3);
        border-radius: 10px;
        padding: 10px 12px;
        background: rgba(10, 14, 23, 0.75);
        color: var(--text-main);
        text-align: left;
        cursor: pointer;
      }

      .quick-nav button.active {
        border-color: var(--accent-teal);
        box-shadow: 0 0 0 2px rgba(0, 200, 160, 0.2);
        animation: navPing 240ms ease;
      }

      @keyframes unfoldMenu {
        0% {
          opacity: 0;
          transform: perspective(700px) rotateX(-25deg) scaleY(0.65);
        }
        100% {
          opacity: 1;
          transform: perspective(700px) rotateX(0deg) scaleY(1);
        }
      }

      @keyframes panelPulse {
        0% {
          transform: translateY(0) scale(1);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }
        40% {
          transform: translateY(-2px) scale(1.008);
          box-shadow: 0 24px 56px rgba(0, 200, 160, 0.2);
        }
        100% {
          transform: translateY(0) scale(1);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }
      }

      @keyframes titleGlitch {
        0% {
          letter-spacing: 0;
          filter: hue-rotate(0deg);
          opacity: 0.55;
        }
        50% {
          letter-spacing: 0.8px;
          filter: hue-rotate(25deg);
          opacity: 1;
        }
        100% {
          letter-spacing: 0;
          filter: hue-rotate(0deg);
          opacity: 1;
        }
      }

      @keyframes techSlideIn {
        0% {
          opacity: 0;
          transform: translateY(5px) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes workspaceReveal {
        0% {
          opacity: 0;
          transform: translateY(8px);
          clip-path: inset(0 0 100% 0);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          clip-path: inset(0 0 0 0);
        }
      }

      @keyframes navPing {
        0% {
          transform: translateX(0);
        }
        45% {
          transform: translateX(2px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes fxMain {
        0% {
          transform: translateY(10px);
          opacity: 0.72;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes fxPallet {
        0% {
          transform: translateX(-10px);
          filter: hue-rotate(-8deg);
        }
        100% {
          transform: translateX(0);
          filter: hue-rotate(0deg);
        }
      }

      @keyframes fxCreate {
        0% {
          transform: scale(0.985);
          opacity: 0.7;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes fxArnest {
        0% {
          transform: perspective(700px) rotateX(-6deg);
          filter: saturate(0.8);
        }
        100% {
          transform: perspective(700px) rotateX(0deg);
          filter: saturate(1);
        }
      }

      @keyframes fxOrders {
        0% {
          transform: translateX(10px);
          opacity: 0.72;
        }
        100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @keyframes fxAssemble {
        0% {
          transform: translateY(-8px) scale(0.99);
          opacity: 0.75;
        }
        100% {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      @keyframes fxNomenclature {
        0% {
          transform: perspective(800px) rotateY(4deg);
          filter: brightness(0.9);
        }
        100% {
          transform: perspective(800px) rotateY(0deg);
          filter: brightness(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="main-area">
        <section class="panel">
          <h1 id="menu-title">Главное меню</h1>
          <p class="muted">Вы вошли как администратор.</p>
          <div class="menu-items">
            <button id="pallet-list-button" class="menu-button" type="button">Паллетные листы</button>
            <button id="orders-button" class="menu-button" type="button">Заказы</button>
            <button id="nomenclature-button" class="menu-button" type="button">Номенклатура</button>
            <button id="create-pallet-button" class="menu-button menu-step" type="button">
              Создать паллетные листы
            </button>
            <button id="back-to-main-button" class="menu-button menu-step back-button" type="button">
              Назад
            </button>
            <button id="arnest-button" class="menu-button menu-step" type="button">Арнест Юнирусь</button>
            <button id="back-to-pallet-button" class="menu-button menu-step back-button" type="button">
              Назад
            </button>
            <button id="assemble-order-button" class="menu-button menu-step" type="button">
              Сборка заказа
            </button>
            <button id="back-to-main-orders-button" class="menu-button menu-step back-button" type="button">
              Назад
            </button>
            <button id="back-to-main-nomenclature-button" class="menu-button menu-step back-button" type="button">
              Назад
            </button>
          </div>

          <section id="arnest-workspace" class="arnest-workspace">
            <p class="muted">Черновик программы создания паллетного листа</p>
            <div class="arnest-grid">
              <div class="arnest-field"><label for="article">Артикул</label><input id="article" value="A-100" /></div>
              <div class="arnest-field"><label for="name">Наименование</label><input id="name" value="Товар Арнест" /></div>
              <div class="arnest-field"><label for="batch">Партия</label><input id="batch" value="Партия-001" /></div>
              <div class="arnest-field"><label for="pallet-number">Номер паллета</label><input id="pallet-number" value="1" /></div>
              <div class="arnest-field"><label for="prod-date">Дата изготовления (YYMMDD)</label><input id="prod-date" value="241125" /></div>
              <div class="arnest-field"><label for="exp-date">Дата годности (YYMMDD)</label><input id="exp-date" value="241227" /></div>
              <div class="arnest-field"><label for="boxes-row">Коробок в ряду</label><input id="boxes-row" value="24" /></div>
              <div class="arnest-field"><label for="full-rows">Полных рядов</label><input id="full-rows" value="5" /></div>
              <div class="arnest-field"><label for="extra-boxes">Коробок сверх рядов</label><input id="extra-boxes" value="2" /></div>
              <div class="arnest-field"><label for="pieces-box">Штук в коробке</label><input id="pieces-box" value="12" /></div>
              <div class="arnest-field"><label for="box-weight">Вес коробки (кг)</label><input id="box-weight" value="0.45" /></div>
            </div>
            <div class="arnest-actions">
              <button id="build-sheet" class="menu-button" type="button">Сформировать паллетный лист</button>
            </div>
            <div id="arnest-output" class="arnest-output"></div>
          </section>

          <section id="nomenclature-workspace" class="nomenclature-workspace">
            <p class="muted">Список товаров</p>
            <input
              id="nomenclature-search"
              class="nomenclature-search"
              type="text"
              placeholder="Поиск по артикулу или наименованию..."
            />
            <div id="nomenclature-list"></div>
          </section>
        </section>
      </main>

      <aside class="sidebar" id="sidebar">
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" title="Свернуть/развернуть">
          ◀
        </button>
        <div class="resize-handle" id="resize-handle" aria-hidden="true"></div>
        <h2 class="sidebar-title">Быстрая навигация</h2>
        <p class="sidebar-note">Переход к любому этапу меню</p>
        <nav class="quick-nav">
          <button id="nav-main" type="button">Главное меню</button>
          <button id="nav-pallet" type="button">Паллетные листы</button>
          <button id="nav-create" type="button">Создание паллетных листов</button>
          <button id="nav-arnest" type="button">Арнест Юнирусь</button>
          <button id="nav-orders" type="button">Заказы</button>
          <button id="nav-assemble" type="button">Сборка заказа</button>
          <button id="nav-nomenclature" type="button">Номенклатура</button>
        </nav>
      </aside>
    </div>

    <div id="nomenclature-edit-overlay" class="modal-overlay" hidden>
      <div
        class="modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="nomenclature-edit-title"
      >
        <h3 id="nomenclature-edit-title">Редактировать товар</h3>
        <form id="nomenclature-edit-form" class="arnest-grid">
          <div class="arnest-field">
            <label for="edit-article">Артикул</label>
            <input id="edit-article" name="article" type="text" autocomplete="off" />
          </div>
          <div class="arnest-field" style="grid-column: 1 / -1">
            <label for="edit-name">Наименование</label>
            <textarea id="edit-name" name="name" rows="3"></textarea>
          </div>
          <div class="arnest-field">
            <label for="edit-pieces-in-box">Штук в коробке</label>
            <input id="edit-pieces-in-box" name="pieces_in_box" type="number" min="0" step="1" />
          </div>
          <div class="arnest-field">
            <label for="edit-row-layout">Укладка ряда (коробок в ряду)</label>
            <input id="edit-row-layout" name="row_layout" type="number" min="0" step="1" />
          </div>
          <div class="arnest-field">
            <label for="edit-max-rows">Максимум рядов</label>
            <input id="edit-max-rows" name="max_rows" type="number" min="0" step="1" />
          </div>
          <div class="arnest-field">
            <label for="edit-box-weight">Вес коробки (кг)</label>
            <input id="edit-box-weight" name="box_weight" type="number" min="0" step="any" />
          </div>
        </form>
        <div class="modal-actions">
          <button class="menu-button" type="submit" form="nomenclature-edit-form">Сохранить</button>
          <button id="nomenclature-edit-cancel" class="menu-button" type="button">Отмена</button>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const login = params.get("login");
      const password = params.get("password");

      if (!(login === "admin" && password === "1241")) {
        window.location.replace("index.html");
      }

      const palletListButton = document.getElementById("pallet-list-button");
      const ordersButton = document.getElementById("orders-button");
      const nomenclatureButton = document.getElementById("nomenclature-button");
      const menuTitle = document.getElementById("menu-title");
      const createPalletButton = document.getElementById("create-pallet-button");
      const backToMainButton = document.getElementById("back-to-main-button");
      const arnestButton = document.getElementById("arnest-button");
      const backToPalletButton = document.getElementById("back-to-pallet-button");
      const assembleOrderButton = document.getElementById("assemble-order-button");
      const backToMainOrdersButton = document.getElementById("back-to-main-orders-button");
      const backToMainNomenclatureButton = document.getElementById("back-to-main-nomenclature-button");
      const navMain = document.getElementById("nav-main");
      const navPallet = document.getElementById("nav-pallet");
      const navCreate = document.getElementById("nav-create");
      const navArnest = document.getElementById("nav-arnest");
      const navOrders = document.getElementById("nav-orders");
      const navAssemble = document.getElementById("nav-assemble");
      const navNomenclature = document.getElementById("nav-nomenclature");
      const arnestWorkspace = document.getElementById("arnest-workspace");
      const nomenclatureWorkspace = document.getElementById("nomenclature-workspace");
      const nomenclatureList = document.getElementById("nomenclature-list");
      const nomenclatureSearch = document.getElementById("nomenclature-search");
      const nomenclatureEditOverlay = document.getElementById("nomenclature-edit-overlay");
      const nomenclatureEditForm = document.getElementById("nomenclature-edit-form");
      const nomenclatureEditCancel = document.getElementById("nomenclature-edit-cancel");
      const editArticleInput = document.getElementById("edit-article");
      const editNameInput = document.getElementById("edit-name");
      const editPiecesInput = document.getElementById("edit-pieces-in-box");
      const editRowLayoutInput = document.getElementById("edit-row-layout");
      const editMaxRowsInput = document.getElementById("edit-max-rows");
      const editBoxWeightInput = document.getElementById("edit-box-weight");
      let nomenclatureEditId = null;
      const output = document.getElementById("arnest-output");
      const buildSheetButton = document.getElementById("build-sheet");
      const quickNav = document.querySelector(".quick-nav");
      const sidebar = document.getElementById("sidebar");
      const sidebarToggle = document.getElementById("sidebar-toggle");
      const panel = document.querySelector(".panel");
      const resizeHandle = document.getElementById("resize-handle");
      const navButtons = {
        main: navMain,
        pallet: navPallet,
        create: navCreate,
        arnest: navArnest,
        orders: navOrders,
        assemble: navAssemble,
        nomenclature: navNomenclature,
      };
      const defaultNavOrder = ["main", "pallet", "create", "arnest", "orders", "assemble", "nomenclature"];
      const navOrderStorageKey = "paletlist-last-nav-order";
      let navOrder = [...defaultNavOrder];
      let currentStage = "main";
      let sidebarCollapsed = false;
      let nomenclatureItems = [];

      const savedOrder = localStorage.getItem(navOrderStorageKey);
      if (savedOrder) {
        try {
          const parsed = JSON.parse(savedOrder);
          if (Array.isArray(parsed)) {
            navOrder = [
              ...parsed.filter((stage) => defaultNavOrder.includes(stage)),
              ...defaultNavOrder.filter((stage) => !parsed.includes(stage)),
            ];
          }
        } catch (error) {
          navOrder = [...defaultNavOrder];
        }
      }

      function renderNavOrder() {
        navOrder.forEach((stage) => {
          quickNav.appendChild(navButtons[stage]);
        });
      }

      function updateVisitedOrder(stage) {
        navOrder = [stage, ...navOrder.filter((item) => item !== stage)];
        localStorage.setItem(navOrderStorageKey, JSON.stringify(navOrder));
        renderNavOrder();
      }

      function runTransitionEffects() {
        const effectClasses = [
          "fx-main",
          "fx-pallet",
          "fx-create",
          "fx-arnest",
          "fx-orders",
          "fx-assemble",
          "fx-nomenclature",
        ];
        panel.classList.remove("transitioning");
        effectClasses.forEach((className) => panel.classList.remove(className));
        menuTitle.classList.remove("title-swap");
        void panel.offsetWidth;
        panel.classList.add("transitioning");
        menuTitle.classList.add("title-swap");
      }

      function setSidebarCollapsed(nextCollapsed) {
        sidebarCollapsed = nextCollapsed;
        sidebar.classList.toggle("collapsed", sidebarCollapsed);
        sidebarToggle.textContent = sidebarCollapsed ? "▶" : "◀";
      }

      function setStage(stage, recordVisit = true) {
        if (stage !== currentStage) {
          runTransitionEffects();
          panel.classList.add(`fx-${stage}`);
        }

        menuTitle.textContent = "Главное меню";
        panel.classList.remove("wide");
        palletListButton.style.display = "inline-block";
        ordersButton.style.display = "inline-block";
        nomenclatureButton.style.display = "inline-block";
        createPalletButton.classList.remove("visible");
        backToMainButton.classList.remove("visible");
        arnestButton.classList.remove("visible");
        backToPalletButton.classList.remove("visible");
        assembleOrderButton.classList.remove("visible");
        backToMainOrdersButton.classList.remove("visible");
        backToMainNomenclatureButton.classList.remove("visible");
        arnestWorkspace.classList.remove("visible");
        nomenclatureWorkspace.classList.remove("visible");

        if (stage === "pallet") {
          menuTitle.textContent = "Паллетные листы";
          palletListButton.style.display = "none";
          ordersButton.style.display = "none";
          nomenclatureButton.style.display = "none";
          createPalletButton.classList.add("visible");
          backToMainButton.classList.add("visible");
        }

        if (stage === "create" || stage === "arnest") {
          menuTitle.textContent = "Создание паллетных листов";
          palletListButton.style.display = "none";
          arnestButton.classList.add("visible");
          backToPalletButton.classList.add("visible");
        }

        if (stage === "arnest") {
          menuTitle.textContent = "Арнест Юнирусь";
          arnestButton.classList.remove("visible");
          arnestWorkspace.classList.add("visible");
        }

        if (stage === "orders") {
          menuTitle.textContent = "Заказы";
          palletListButton.style.display = "none";
          ordersButton.style.display = "none";
          nomenclatureButton.style.display = "none";
          assembleOrderButton.classList.add("visible");
          backToMainOrdersButton.classList.add("visible");
        }

        if (stage === "assemble") {
          menuTitle.textContent = "Сборка заказа";
          palletListButton.style.display = "none";
          ordersButton.style.display = "none";
          nomenclatureButton.style.display = "none";
          assembleOrderButton.classList.add("visible");
          backToMainOrdersButton.classList.add("visible");
        }

        if (stage === "nomenclature") {
          menuTitle.textContent = "Номенклатура";
          panel.classList.add("wide");
          palletListButton.style.display = "none";
          ordersButton.style.display = "none";
          nomenclatureButton.style.display = "none";
          backToMainNomenclatureButton.classList.add("visible");
          nomenclatureWorkspace.classList.add("visible");
        }

        navMain.classList.toggle("active", stage === "main");
        navPallet.classList.toggle("active", stage === "pallet");
        navCreate.classList.toggle("active", stage === "create");
        navArnest.classList.toggle("active", stage === "arnest");
        navOrders.classList.toggle("active", stage === "orders");
        navAssemble.classList.toggle("active", stage === "assemble");
        navNomenclature.classList.toggle("active", stage === "nomenclature");

        if (recordVisit) {
          updateVisitedOrder(stage);
        }

        currentStage = stage;
      }

      palletListButton.addEventListener("click", () => setStage("pallet"));
      ordersButton.addEventListener("click", () => setStage("orders"));
      nomenclatureButton.addEventListener("click", () => setStage("nomenclature"));
      createPalletButton.addEventListener("click", () => setStage("create"));
      backToMainButton.addEventListener("click", () => setStage("main"));
      backToPalletButton.addEventListener("click", () => setStage("pallet"));
      assembleOrderButton.addEventListener("click", () => setStage("assemble"));
      backToMainOrdersButton.addEventListener("click", () => setStage("main"));
      backToMainNomenclatureButton.addEventListener("click", () => setStage("main"));
      navMain.addEventListener("click", () => setStage("main"));
      navPallet.addEventListener("click", () => setStage("pallet"));
      navCreate.addEventListener("click", () => setStage("create"));
      navArnest.addEventListener("click", () => setStage("arnest"));
      navOrders.addEventListener("click", () => setStage("orders"));
      navAssemble.addEventListener("click", () => setStage("assemble"));
      navNomenclature.addEventListener("click", () => setStage("nomenclature"));

      const NOMENCLATURE_PACK_ICONS = {
        pieces: `<svg class="pack-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h3M13 9h3M8 13h3M13 13h3"/></svg>`,
        row: `<svg class="pack-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="9" width="5" height="6" rx="1"/><rect x="9.5" y="9" width="5" height="6" rx="1"/><rect x="17" y="9" width="5" height="6" rx="1"/></svg>`,
        layers: `<svg class="pack-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 8l8-3 8 3-8 3-8-3z"/><path d="M4 12l8 3 8-3"/><path d="M4 16l8 3 8-3"/></svg>`,
        weight: `<svg class="pack-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3v4"/><circle cx="12" cy="13" r="6"/><path d="M9 7h6"/></svg>`,
      };

      function formatPackInt(value) {
        const n = Number(value);
        return String(Number.isFinite(n) ? Math.trunc(n) : 0);
      }

      function formatPackWeight(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) {
          return "0";
        }
        const r = Math.round(n * 100) / 100;
        return String(r);
      }

      function openNomenclatureEdit(item) {
        nomenclatureEditId = item.id;
        editArticleInput.value = item.article || "";
        editNameInput.value = item.name || "";
        editPiecesInput.value = formatPackInt(item.pieces_in_box);
        editRowLayoutInput.value = formatPackInt(item.row_layout);
        editMaxRowsInput.value = formatPackInt(item.max_rows);
        editBoxWeightInput.value = formatPackWeight(item.box_weight);
        nomenclatureEditOverlay.hidden = false;
        editArticleInput.focus();
        editArticleInput.select();
      }

      function closeNomenclatureEdit() {
        nomenclatureEditOverlay.hidden = true;
        nomenclatureEditId = null;
        nomenclatureEditForm.reset();
      }

      function nomenclaturePackRowHtml(item) {
        const p = formatPackInt(item.pieces_in_box);
        const row = formatPackInt(item.row_layout);
        const maxR = formatPackInt(item.max_rows);
        const w = formatPackWeight(item.box_weight);
        return `<div class="nomenclature-pack-line">
          <span class="pack-stat" title="Штук в коробке">${NOMENCLATURE_PACK_ICONS.pieces}<span>${escapeXml(p)}</span></span>
          <span class="pack-stat" title="Укладка ряда (коробок в ряду)">${NOMENCLATURE_PACK_ICONS.row}<span>${escapeXml(row)}</span></span>
          <span class="pack-stat" title="Максимум рядов">${NOMENCLATURE_PACK_ICONS.layers}<span>${escapeXml(maxR)}</span></span>
          <span class="pack-stat" title="Вес коробки, кг">${NOMENCLATURE_PACK_ICONS.weight}<span>${escapeXml(w)}</span></span>
        </div>`;
      }

      async function loadNomenclature() {
        try {
          const res = await fetch("/api/nomenclature");
          if (!res.ok) {
            throw new Error("API error");
          }
          nomenclatureItems = await res.json();
          renderNomenclatureList(nomenclatureItems);
        } catch (error) {
          nomenclatureList.innerHTML = "<div class='nomenclature-item'>Не удалось загрузить номенклатуру.</div>";
        }
      }

      function renderNomenclatureList(items) {
        if (!items.length) {
          nomenclatureList.innerHTML = "<div class='nomenclature-item'>Ничего не найдено.</div>";
          return;
        }

        nomenclatureList.innerHTML = items
            .map(
              (item) =>
                `<div class="nomenclature-item">
                  <div class="nomenclature-meta">
                    <div class="article">${escapeXml(item.article || "—")}</div>
                    <div>${escapeXml(item.name || "Без названия")}</div>
                    ${nomenclaturePackRowHtml(item)}
                  </div>
                  <div class="nomenclature-actions">
                    <button class="icon-btn" data-action="edit" data-id="${item.id}" title="Редактировать">✏️</button>
                    <button class="icon-btn" data-action="delete" data-id="${item.id}" title="Удалить">🗑️</button>
                  </div>
                </div>`,
            )
            .join("");
      }

      let isResizing = false;

      function formatDateYYMMDD(dateStr) {
        if (/^\d{6}$/.test(dateStr)) {
          return `${dateStr.slice(0, 2)}.${dateStr.slice(2, 4)}.${dateStr.slice(4, 6)}`;
        }
        return dateStr;
      }

      function formatDateForBarcode(dateStr) {
        if (/^\d{6}$/.test(dateStr)) {
          return `${dateStr.slice(4, 6)}${dateStr.slice(2, 4)}${dateStr.slice(0, 2)}`;
        }
        return dateStr;
      }

      function toNumber(value) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function buildSheetPreview() {
        const article = document.getElementById("article").value.trim();
        const name = document.getElementById("name").value.trim();
        const batch = document.getElementById("batch").value.trim();
        const palletNumber = toNumber(document.getElementById("pallet-number").value);
        const productionDate = document.getElementById("prod-date").value.trim();
        const expiryDate = document.getElementById("exp-date").value.trim();
        const boxesPerRow = toNumber(document.getElementById("boxes-row").value);
        const fullRows = toNumber(document.getElementById("full-rows").value);
        const extraBoxes = toNumber(document.getElementById("extra-boxes").value);
        const piecesPerBox = toNumber(document.getElementById("pieces-box").value);
        const boxWeight = toNumber(document.getElementById("box-weight").value);

        const totalBoxes = boxesPerRow * fullRows + extraBoxes;
        const totalPieces = totalBoxes * piecesPerBox;
        const palletWeight = totalBoxes * boxWeight;
        const productionDateUI = formatDateYYMMDD(productionDate);
        const expiryDateUI = formatDateYYMMDD(expiryDate);
        const complexBarcode = `${article} ${batch} ${formatDateForBarcode(productionDate)} ${formatDateForBarcode(expiryDate)}`;
        const boxesBarcode = String(totalBoxes);
        const palletBarcode = `15000000${String(Math.max(0, palletNumber)).padStart(2, "0")}`;

        output.innerHTML = `
          <strong>Предпросмотр паллетного листа</strong><br />
          Наименование: ${name}<br />
          Артикул: ${article}<br />
          Партия: ${batch}<br />
          Дата изготовления: ${productionDateUI}<br />
          Срок годности до: ${expiryDateUI}<br />
          Коробок всего: ${totalBoxes}<br />
          Штук всего: ${totalPieces}<br />
          Вес паллета: ${palletWeight.toFixed(2)} кг<br />
          <br />
          Сложный штрихкод: ${complexBarcode}<br />
          Штрихкод коробок: ${boxesBarcode}<br />
          Штрихкод паллета: ${palletBarcode}
        `;

        return {
          article,
          name,
          batch,
          palletNumber,
          productionDateUI,
          expiryDateUI,
          boxesPerRow,
          fullRows,
          extraBoxes,
          totalBoxes,
          piecesPerBox,
          totalPieces,
          boxWeight,
          palletWeight,
          complexBarcode,
          boxesBarcode,
          palletBarcode,
        };
      }

      function escapeXml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&apos;");
      }

      function dataUrlToUint8Array(dataUrl) {
        const base64 = dataUrl.split(",")[1];
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function createBarcodePngBytes(value, widthPx = 2, heightPx = 80) {
        const canvas = document.createElement("canvas");
        JsBarcode(canvas, value, {
          format: "CODE128",
          displayValue: true,
          fontSize: 14,
          margin: 8,
          width: widthPx,
          height: heightPx,
        });
        return dataUrlToUint8Array(canvas.toDataURL("image/png"));
      }

      async function downloadPalletSheetDocm(data) {
        const { Document, Packer, Paragraph, TextRun, HeadingLevel, ImageRun } = docx;

        const complexBarcodePng = createBarcodePngBytes(data.complexBarcode, 1.8, 90);
        const boxesBarcodePng = createBarcodePngBytes(data.boxesBarcode, 2.2, 90);
        const palletBarcodePng = createBarcodePngBytes(data.palletBarcode, 2.2, 90);

        const wordDocument = new Document({
          sections: [
            {
              children: [
                new Paragraph({ text: "ПАЛЛЕТНЫЙ ЛИСТ", heading: HeadingLevel.HEADING_1 }),
                new Paragraph(`Наименование: ${data.name}`),
                new Paragraph(`Артикул: ${data.article}`),
                new Paragraph(`Партия: ${data.batch}`),
                new Paragraph(`Номер паллета: ${data.palletNumber}`),
                new Paragraph(`Дата изготовления: ${data.productionDateUI}`),
                new Paragraph(`Срок годности до: ${data.expiryDateUI}`),
                new Paragraph(""),
                new Paragraph("Данные по сборке:"),
                new Paragraph(`Коробок в ряду: ${data.boxesPerRow}`),
                new Paragraph(`Полных рядов: ${data.fullRows}`),
                new Paragraph(`Коробок сверх рядов: ${data.extraBoxes}`),
                new Paragraph(`Коробок всего: ${data.totalBoxes}`),
                new Paragraph(`Штук в коробке: ${data.piecesPerBox}`),
                new Paragraph(`Штук всего: ${data.totalPieces}`),
                new Paragraph(`Вес паллета (кг): ${data.palletWeight.toFixed(2)}`),
                new Paragraph(""),
                new Paragraph("Сложный штрихкод:"),
                new Paragraph({
                  children: [new ImageRun({ data: complexBarcodePng, transformation: { width: 620, height: 90 } })],
                }),
                new Paragraph("Штрихкод коробок:"),
                new Paragraph({
                  children: [new ImageRun({ data: boxesBarcodePng, transformation: { width: 320, height: 90 } })],
                }),
                new Paragraph("Штрихкод паллета:"),
                new Paragraph({
                  children: [new ImageRun({ data: palletBarcodePng, transformation: { width: 320, height: 90 } })],
                }),
                new Paragraph({
                  children: [new TextRun(`Значение: ${data.palletBarcode}`)],
                }),
              ],
            },
          ],
        });

        const outputBlob = await Packer.toBlob(wordDocument);
        const safeArticle = data.article ? data.article.replace(/[^\w.-]/g, "_") : "pallet";
        const link = document.createElement("a");
        link.href = URL.createObjectURL(outputBlob);
        link.download = `pallet_sheet_${safeArticle}_${Date.now()}.docx`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      }

      resizeHandle.addEventListener("mousedown", () => {
        isResizing = true;
        document.body.classList.add("resizing");
      });

      window.addEventListener("mousemove", (event) => {
        if (!isResizing) {
          return;
        }

        const nextWidth = window.innerWidth - event.clientX;
        const boundedWidth = Math.max(260, Math.min(620, nextWidth));
        sidebar.style.width = `${boundedWidth}px`;
      });

      window.addEventListener("mouseup", () => {
        isResizing = false;
        document.body.classList.remove("resizing");
      });

      sidebarToggle.addEventListener("click", () => {
        setSidebarCollapsed(!sidebarCollapsed);
      });

      buildSheetButton.addEventListener("click", async () => {
        try {
          const data = buildSheetPreview();
          await downloadPalletSheetDocm(data);
        } catch (error) {
          output.innerHTML = `<strong>Ошибка:</strong> ${error.message}`;
        }
      });

      nomenclatureSearch.addEventListener("input", () => {
        const query = nomenclatureSearch.value.trim().toLowerCase();
        if (!query) {
          renderNomenclatureList(nomenclatureItems);
          return;
        }

        const filtered = nomenclatureItems.filter((item) => {
          const article = (item.article || "").toLowerCase();
          const name = (item.name || "").toLowerCase();
          return article.includes(query) || name.includes(query);
        });
        renderNomenclatureList(filtered);
      });

      nomenclatureList.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) {
          return;
        }
        const action = button.dataset.action;
        const id = Number(button.dataset.id);
        const item = nomenclatureItems.find((entry) => entry.id === id);
        if (!item) {
          return;
        }

        if (action === "edit") {
          openNomenclatureEdit(item);
          return;
        }

        if (action === "delete") {
          const confirmed = confirm("Удалить номенклатуру? Поля будут очищены, id останется.");
          if (!confirmed) {
            return;
          }
          const response = await fetch(`/api/nomenclature/${item.id}`, {
            method: "DELETE",
          });
          if (!response.ok) {
            alert("Не удалось удалить номенклатуру из БД.");
            return;
          }
          await loadNomenclature();
          const query = nomenclatureSearch.value.trim().toLowerCase();
          if (!query) {
            renderNomenclatureList(nomenclatureItems);
          } else {
            const filtered = nomenclatureItems.filter((entry) => {
              const article = (entry.article || "").toLowerCase();
              const name = (entry.name || "").toLowerCase();
              return article.includes(query) || name.includes(query);
            });
            renderNomenclatureList(filtered);
          }
        }
      });

      nomenclatureEditForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (nomenclatureEditId === null) {
          return;
        }
        const weightRaw = String(editBoxWeightInput.value).trim().replace(",", ".");
        const parsedWeight = Number(weightRaw);
        const parsedBoxWeight = Number.isFinite(parsedWeight) ? parsedWeight : 0;
        const response = await fetch(`/api/nomenclature/${nomenclatureEditId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            article: editArticleInput.value.trim(),
            name: editNameInput.value.trim(),
            pieces_in_box: Math.trunc(Number(editPiecesInput.value)) || 0,
            row_layout: Math.trunc(Number(editRowLayoutInput.value)) || 0,
            max_rows: Math.trunc(Number(editMaxRowsInput.value)) || 0,
            box_weight: parsedBoxWeight,
          }),
        });
        if (!response.ok) {
          alert("Не удалось обновить номенклатуру в БД.");
          return;
        }
        closeNomenclatureEdit();
        await loadNomenclature();
        const query = nomenclatureSearch.value.trim().toLowerCase();
        if (!query) {
          renderNomenclatureList(nomenclatureItems);
        } else {
          const filtered = nomenclatureItems.filter((entry) => {
            const article = (entry.article || "").toLowerCase();
            const name = (entry.name || "").toLowerCase();
            return article.includes(query) || name.includes(query);
          });
          renderNomenclatureList(filtered);
        }
      });

      nomenclatureEditCancel.addEventListener("click", () => {
        closeNomenclatureEdit();
      });

      nomenclatureEditOverlay.addEventListener("click", (event) => {
        if (event.target === nomenclatureEditOverlay) {
          closeNomenclatureEdit();
        }
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !nomenclatureEditOverlay.hidden) {
          closeNomenclatureEdit();
        }
      });

      renderNavOrder();
      setStage("main", false);
      setSidebarCollapsed(false);
      buildSheetPreview();
      loadNomenclature();
    </script>
  </body>
</html>
