<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paletlist - Админ</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1524;
        color: #e0e0ff;
        font-family: Arial, sans-serif;
      }

      .panel {
        width: min(560px, 90vw);
        border: 1px solid #2e3f63;
        border-radius: 12px;
        background: #171f33;
        padding: 24px;
      }

      h1 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>Панель администратора</h1>
      <p>Вы вошли как администратор.</p>
      <p>Логин: admin</p>
    </section>
  </body>
</html>
