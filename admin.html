<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paletlist - Админ</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap"
    />
    <style>
      :root {
        --bg-primary: #0a0e17;
        --bg-secondary: #121826;
        --accent-teal: #00c8a0;
        --accent-purple: #b967ff;
        --text-main: #e0e0ff;
        --text-muted: #a0a0c0;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
        color: var(--text-main);
        font-family: "Roboto", sans-serif;
      }

      .panel {
        width: min(560px, 90vw);
        border: 1px solid rgba(0, 200, 160, 0.25);
        border-radius: 16px;
        background: rgba(18, 24, 38, 0.82);
        backdrop-filter: blur(8px);
        padding: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 10px;
        font-family: "Orbitron", sans-serif;
        background: linear-gradient(to right, var(--accent-teal), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .muted {
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>Админ</h1>
      <p class="muted">Вы вошли в панель администратора.</p>
    </section>

    <script>
      const params = new URLSearchParams(window.location.search);
      const login = params.get("login");
      const password = params.get("password");

      if (!(login === "admin" && password === "1241")) {
        window.location.replace("index.html");
      }
    </script>
  </body>
</html>
