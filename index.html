<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paletlist - Вход</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@300;400;500&display=swap"
    />
    <style>
      :root {
        --bg-primary: #0a0e17;
        --bg-secondary: #121826;
        --accent-teal: #00c8a0;
        --accent-purple: #b967ff;
        --text-main: #e0e0ff;
        --text-muted: #a0a0c0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
        font-family: "Roboto", sans-serif;
        color: var(--text-main);
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        background: rgba(18, 24, 38, 0.82);
        border: 1px solid rgba(0, 200, 160, 0.25);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
      }

      .logo {
        font-family: "Orbitron", sans-serif;
        font-size: 26px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 10px;
        background: linear-gradient(to right, var(--accent-teal), var(--accent-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        text-align: center;
        color: var(--text-muted);
        margin-bottom: 26px;
      }

      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-muted);
        font-size: 14px;
      }

      input {
        width: 100%;
        border: 1px solid rgba(0, 200, 160, 0.25);
        border-radius: 10px;
        padding: 12px 14px;
        background: rgba(10, 14, 23, 0.75);
        color: var(--text-main);
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent-teal);
        box-shadow: 0 0 0 3px rgba(0, 200, 160, 0.18);
      }

      button {
        width: 100%;
        margin-top: 10px;
        border: none;
        border-radius: 30px;
        padding: 13px 16px;
        font-family: "Orbitron", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        cursor: pointer;
        color: #09111e;
        background: linear-gradient(45deg, var(--accent-teal), var(--accent-purple));
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 200, 160, 0.35);
      }

      .error-message {
        margin-top: 14px;
        min-height: 20px;
        color: #ff8da1;
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1 class="logo">Paletlist</h1>
      <p class="subtitle">Вход в личный кабинет</p>
      <form id="login-form" action="admin.html" method="get">
        <div class="field">
          <label for="login">Логин</label>
          <input id="login" name="login" type="text" placeholder="Введите логин" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Введите пароль"
            required
          />
        </div>
        <button type="submit">Войти</button>
        <p id="error-message" class="error-message"></p>
      </form>
    </main>
    <script>
      const form = document.getElementById("login-form");
      const errorMessage = document.getElementById("error-message");
      form.addEventListener("submit", (event) => {
        const login = document.getElementById("login").value.trim();
        const password = document.getElementById("password").value.trim();

        if (login === "admin" && password === "1241") {
          return;
        }

        event.preventDefault();
        errorMessage.textContent = "Неверный логин или пароль";
      });
    </script>
  </body>
</html>
